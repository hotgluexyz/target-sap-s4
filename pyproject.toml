[project]
name = "target-sap-s4"
version = "0.1.0"
description = "Standard SAP S/4HANA journal-entry SOAP target for Hotglue."
authors = [{ name = "Hotglue", email = "support@hotglue.com" }]
keywords = [
    "ELT",
    "saps4",
]
license = "Apache-2.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "requests>=2.25.1",
    "hotglue-singer-sdk==1.0.52",
]

[project.scripts]
target-sap-s4 = 'target_sap_s4.target:TargetSapS4.cli'

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
required-version = ">=0.15"

[tool.ruff.lint]
future-annotations = true
ignore = [
    "COM812",
    "FIX002",
    "TD002",
    "TD003",
]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]
"target_sap_s4/client.py" = [
    "ANN401",
    "D102",
    "I001",
]
"target_sap_s4/sinks.py" = [
    "D102",
    "I001",
]
"target_sap_s4/target.py" = [
    "RUF012",
    "I001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"
